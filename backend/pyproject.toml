[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens-backend"
version = "0.1.0"
description = "FastAPI backend for MarketLens AI"
readme = { text = "FastAPI backend package for the MarketLens AI monorepo.", content-type = "text/plain" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "openai==2.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pandas==3.0.5",
    "pymupdf==1.28.0",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.52.1",
    "yfinance==1.5.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
